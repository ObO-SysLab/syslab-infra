name: Infrastructure verification and release artifact
on:
  pull_request:
  push:
    branches: [main, 'fix/**', 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infrastructure-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r grader/requirements.txt
      - name: Unit and mocked integration tests (no database startup)
        run: |
          python -B -m unittest discover -s grader/tests -p 'test_*.py' -v
          python -B -m unittest discover -s vm/codebuild -p 'test_*.py' -v
          python -B -m unittest discover -s vm/lifecycle -p 'test_*.py' -v
          python -B -m unittest discover -s ops -p 'test_*.py' -v
          node --test grader/tests/launch.test.mjs
          node --test vm/ws-server/auth.test.js vm/ws-server/server.test.js vm/ws-server/terminal.test.js
      - name: Build both images and probe Linux isolation on the CI runner
        run: |
          docker build -t diveon-coordinator:${{ github.sha }} grader
          docker build -f grader/runner/Dockerfile -t diveon-runner:${{ github.sha }} grader
          docker build -f grader/runner/Dockerfile.obo-test --build-arg RUNNER_IMAGE=diveon-runner:${{ github.sha }} -t diveon-runner-test:${{ github.sha }} grader
          docker run --rm --network none --read-only --memory 2g --memory-swap 2g --cpus 1 --pids-limit 64 --cap-drop NET_RAW --cap-drop NET_BIND_SERVICE --cap-drop MKNOD --cap-drop SETFCAP --cap-drop SETPCAP --cap-drop SYS_PTRACE --tmpfs /work:rw,exec,nosuid,nodev,size=2g --init diveon-runner-test:${{ github.sha }}
      - name: Probe the practice command restriction layer on real Linux images
        run: DIVEON_RESTRICTION_LINUX=1 python -B -m unittest discover -s vm/codebuild -p 'test_restriction_linux.py' -v
      - name: Build the Lambda coordinator image and start it like Lambda does (no AWS)
        run: |
          docker build -f grader/Dockerfile.lambda -t diveon-coordinator-lambda:${{ github.sha }} grader
          # Lambda runs images as a non-root user on a read-only filesystem with only /tmp writable.
          docker run --rm --network none --read-only --tmpfs /tmp --user 993:990 --entrypoint python3 \
            diveon-coordinator-lambda:${{ github.sha }} -c "import awslambdaric, lambda_coordinator, grader, obo_checker, subprocess; obo_checker.verify_release(); print(subprocess.run(['node', '--version'], capture_output=True, text=True, check=True).stdout.strip()); print('lambda coordinator image OK')"
      - name: Complete source and Lambda bundle (no ECR push)
        run: |
          python -B ops/package_release.py --output release --revision "$GITHUB_SHA"
          docker image inspect diveon-coordinator:${{ github.sha }} diveon-runner:${{ github.sha }} --format '{{.Id}}' > release/local-image-ids.txt
      - uses: actions/upload-artifact@v4
        with:
          name: infrastructure-${{ github.sha }}
          path: release/
          if-no-files-found: error
